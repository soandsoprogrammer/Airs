[workspace]
members = ["crates/core", "crates/platforms", "crates/desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "fs", "net", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
publisher-core = { path = "crates/core" }
publisher-platforms = { path = "crates/platforms" }

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"
