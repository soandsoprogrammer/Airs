[package]
name = "social-publisher"
version.workspace = true
edition.workspace = true
[dependencies]
publisher-core.workspace = true
publisher-platforms.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
gpui-kit = "=0.9.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSGraphics", "NSResponder", "NSView", "NSWindow"] }
